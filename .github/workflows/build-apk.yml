name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Android SDK 在 ubuntu-latest 上已预装（ANDROID_HOME 已设置），所以 settings.gradle.kts 会包含 :app
      - name: Core tests
        run: gradle :core:test --no-daemon
        continue-on-error: true

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: animeko-rulegen-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk animeko-rulegen.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest animeko-rulegen.apk \
            --title "最新构建" \
            --notes "自动构建的 debug APK（提交 ${GITHUB_SHA::7}）。" \
            --prerelease
